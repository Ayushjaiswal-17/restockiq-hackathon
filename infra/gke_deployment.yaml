apiVersion: batch/v1
kind: Job
metadata:
  name: restockiq-gpu-pipeline
spec:
  template:
    spec:
      containers:
        - name: restockiq
          image: gcr.io/YOUR_PROJECT_ID/restockiq-gpu:latest
          resources:
            limits:
              nvidia.com/gpu: 1
          envFrom:
            - secretRef:
                name: restockiq-env
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-tesla-t4